[project]
name = "expense-tracker"
version = "0.1.0"
description = "Multi-agent expense tracking system with natural language querying"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai-agents>=0.17.0",
    "boto3>=1.26.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.20.0",
    "python-dateutil>=2.8.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
